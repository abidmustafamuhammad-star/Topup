<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>404 — Halaman Tidak Ditemukan</title>
<link rel="icon" id="favicon" href="/assets/favicon.ico"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5/dist/brite/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#f0f5ff 0%,#fdf0ff 100%);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem}
h1{font-family:'Poppins',sans-serif;font-size:clamp(5rem,20vw,10rem);font-weight:800;color:#0d6efd;line-height:1;margin:0}
h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(1.2rem,4vw,1.8rem);color:#212529;margin:.5rem 0 1rem}
p{color:#6c757d;max-width:420px;line-height:1.6}
.icon-wrap{font-size:4rem;margin-bottom:.5rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.btn-group-404{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;margin-top:1.5rem}
</style>
</head>
<body>
<div class="icon-wrap">🔍</div>
<h1>404</h1>
<h2>Halaman Tidak Ditemukan</h2>
<p>Halaman yang kamu cari tidak ada atau sudah dipindahkan. Jangan khawatir, kamu bisa kembali ke beranda.</p>
<div class="btn-group-404">
  <a href="/" class="btn btn-primary px-4"><i class="bi bi-house me-2"></i>Ke Beranda</a>
  <a href="/order" class="btn btn-outline-primary px-4"><i class="bi bi-phone me-2"></i>Beli Nomor</a>
  <button class="btn btn-outline-secondary px-4" onclick="history.back()"><i class="bi bi-arrow-left me-2"></i>Kembali</button>
</div>
<div class="mt-5">
  <small class="text-muted" id="siteName">ReceOTP</small>
</div>
<script>
fetch('/api/site-info').then(r=>r.json()).then(d=>{
  if(d.site_name)document.getElementById('siteName').textContent=d.site_name;
  if(d.favicon)document.getElementById('favicon').href=d.favicon;
}).catch(()=>{});
</script>
</body>
</html>
